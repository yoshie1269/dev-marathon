<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客詳細</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">顧客詳細</h1>

    <table class="table table-bordered">
      <tr>
        <th>ID</th>
        <td id="customer_id"></td>
      </tr>
      <tr>
        <th>会社名</th>
        <td id="company_name"></td>
      </tr>
      <tr>
        <th>業種</th>
        <td id="industry"></td>
      </tr>
      <tr>
        <th>連絡先</th>
        <td id="contact"></td>
      </tr>
      <tr>
        <th>所在地</th>
        <td id="location"></td>
      </tr>
    </table>

    <a href="./list.html" class="btn btn-secondary">
      一覧へ戻る
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const customerId = params.get("id");

    fetch(`http://localhost:5631/customers`)
      .then(response => response.json())
      .then(data => {

        const customer = data.find(
          item => item.customer_id == customerId
        );

        document.getElementById("customer_id").textContent =
          customer.customer_id;

        document.getElementById("company_name").textContent =
          customer.company_name;

        document.getElementById("industry").textContent =
          customer.industry;

        document.getElementById("contact").textContent =
          customer.contact;

        document.getElementById("location").textContent =
          customer.location;
      })
      .catch(error => console.error(error));
  </script>
</body>
</html>
