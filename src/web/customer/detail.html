<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客詳細</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">顧客詳細</h1>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <td id="customer_id"></td>
        </tr>

        <tr>
            <th>会社名</th>
            <td>
            <input id="company_name" class="form-control">
            </td>
        </tr>

        <tr>
            <th>業種</th>
            <td>
            <input id="industry" class="form-control">
            </td>
        </tr>

        <tr>
            <th>連絡先</th>
            <td>
            <input id="contact" class="form-control">
            </td>
        </tr>

        <tr>
            <th>所在地</th>
            <td>
            <input id="location" class="form-control">
            </td>
        </tr>
    </table>

    <a href="./list.html" class="btn btn-secondary">
      一覧へ戻る
    </a>

    <button id="delete-button" class="btn btn-danger ml-2">
        削除
    </button>

    <button id="edit-button" class="btn btn-warning ml-2">
        編集
    </button>

    <button id="update-button" class="btn btn-primary ml-2">
        更新
    </button>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const customerId = params.get("id");

    fetch(`http://localhost:5631/customers`)
      .then(response => response.json())
      .then(data => {

        const customer = data.find(
          item => item.customer_id == customerId
        );

        document.getElementById("company_name").value =
        customer.company_name;

        document.getElementById("industry").value =
        customer.industry;

        document.getElementById("contact").value =
        customer.contact;

        document.getElementById("location").value =
        customer.location;
      })

      .catch(error => console.error(error));

      document.getElementById("delete-button")
        .addEventListener("click", () => {

            const result = confirm("本当に削除しますか？");

            if (!result) {
            return;
            }

            fetch(`http://localhost:5631/delete-customer/${customerId}`, {
            method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {

            if (data.success) {
                alert("削除しました");
                window.location.href = "./list.html";
            } else {
                alert("削除失敗");
            }

            })
            .catch(error => console.error(error));
        });

    document.getElementById("edit-button")
        .addEventListener("click", () => {
            window.location.href = `./update.html?id=${customerId}`;
        });

    document.getElementById("update-button")
        .addEventListener("click", () => {

            fetch(`http://localhost:5631/update-customer/${customerId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                companyName:
                document.getElementById("company_name").value,

                industry:
                document.getElementById("industry").value,

                contact:
                document.getElementById("contact").value,

                location:
                document.getElementById("location").value
            })
            })
            .then(response => response.json())
            .then(data => {

            if (data.success) {
                alert("更新しました");
                location.reload();
            } else {
                alert("更新失敗");
            }

            })
            .catch(error => console.error(error));
        });
  </script>
</body>
</html>
