<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客登録確認</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">入力内容の確認</h2>

    <p><strong>会社名：</strong><span id="companyName"></span></p>
    <p><strong>業種：</strong><span id="industry"></span></p>
    <p><strong>連絡先：</strong><span id="contact"></span></p>
    <p><strong>所在地：</strong><span id="location"></span></p>

    <button id="submit-button" class="btn btn-primary">登録する</button>
    <button onclick="history.back()" class="btn btn-secondary ml-2">戻る</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const companyName = params.get("companyName");
    const industry = params.get("industry");
    const contact = params.get("contact");
    const locationValue = params.get("location");

    document.getElementById("companyName").textContent = companyName;
    document.getElementById("industry").textContent = industry;
    document.getElementById("contact").textContent = contact;
    document.getElementById("location").textContent = locationValue;

    document.getElementById("submit-button").addEventListener("click", () => {
      fetch("http://localhost:5631/add-customer", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          companyName: companyName,
          industry: industry,
          contact: contact,
          location: locationValue
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert("顧客情報が正常に保存されました。");
          window.location.href = "./list.html";
        } else {
          alert("保存に失敗しました。");
        }
      })
      .catch(error => console.error("Error:", error));
    });
  </script>
</body>
</html>
